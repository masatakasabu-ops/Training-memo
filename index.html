<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>練習メモ</title>
<meta name="theme-color" content="#f4f6f1">
<!-- ホーム画面に追加したとき、ブラウザのタブではなく独立した画面で開く -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="練習メモ">
<style>
/* 練習メモ（memo.html）とルート図（route/）を1つのアプリにまとめる枠。
   それぞれを iframe で開いたままにして、下のタブで切り替える（切り替えても入力途中の内容は消えない） */
:root {
  --bg: #f4f6f1;
  --fg: #1d241c;
  --muted: #5d6a5b;
  --line: #d9dfd3;
  --accent: #e8731a;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141913; --fg: #e8ede4; --muted: #9aa697; --line: #2f392d; --accent: #f08a35; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #141913; --fg: #e8ede4; --muted: #9aa697; --line: #2f392d; --accent: #f08a35; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden;
}
[hidden] { display: none !important; }
.offline {
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
  background: var(--line); color: var(--fg); font-size: .75rem; text-align: center;
}
.frames { position: relative; min-height: 0; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
.dock {
  display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: var(--bg);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.dock button {
  display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; border: 0; background: transparent;
  color: var(--muted); font: inherit; font-size: .7rem; font-weight: 700; letter-spacing: .04em; cursor: pointer;
}
.dock svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.dock button[aria-selected="true"] { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<div class="offline" id="offline" role="status">電波がありません ・ 最後に読み込んだ内容を表示しています</div>
<div class="frames" id="frames"></div>
<nav class="dock" role="tablist" aria-label="アプリの切り替え">
  <button type="button" role="tab" id="tabMemo" aria-selected="true">
    <!-- 記録のバインダー -->
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>
    トレーニング
  </button>
  <button type="button" role="tab" id="tabRoute" aria-selected="false">
    <!-- 折りたたんだ地図とレッグ -->
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14" stroke-width="1.2"/><circle cx="7" cy="15" r="1.4"/><circle cx="17" cy="9" r="1.4"/><path d="M8.2 13.9l7.6-3.8"/></svg>
    ルート図
  </button>
</nav>
<script>
const $ = id => document.getElementById(id);
const frames = {};

// ルート図は最初に開いたときに読み込む（練習メモだけ使う日は軽く起動する）
function frame(name, src) {
  if (!frames[name]) {
    const f = frames[name] = document.createElement("iframe");
    f.title = name === "memo" ? "トレーニング" : "ルート図";
    f.ready = new Promise(r => f.addEventListener("load", r, { once: true }));
    f.src = src;
    $("frames").append(f);
  }
  return frames[name];
}

function show(name) {
  for (const [k, f] of Object.entries(frames)) f.hidden = k !== name;
  $("tabMemo").setAttribute("aria-selected", String(name === "memo"));
  $("tabRoute").setAttribute("aria-selected", String(name === "route"));
}

// 練習メモの「ルート図を作る」から呼ばれる。初めてならその記録付きで読み込み、開いていれば記録だけ渡す
window.openRoute = async actId => {
  const hash = actId ? "#act-" + encodeURIComponent(actId) : "";
  const fresh = !frames.route, f = frame("route", "route/" + hash);
  show("route");
  if (fresh || !actId) return;
  await f.ready;
  f.contentWindow.openActivity(actId);
};

$("tabMemo").addEventListener("click", () => show("memo"));
$("tabRoute").addEventListener("click", () => { frame("route", "route/"); show("route"); });

// 電波がなくても開けるように、アプリのファイルを端末に保存しておく（sw.js）
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const online = () => { $("offline").hidden = navigator.onLine; };
addEventListener("online", online); addEventListener("offline", online); online();

// 「…/Training-memo/#ex-menu-P」のような図解へのリンクは、そのまま練習メモに渡す
frame("memo", "memo.html" + location.hash);
show("memo");
</script>
</body>
</html>
