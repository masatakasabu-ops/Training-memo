<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>練習メモ</title>
<meta name="theme-color" content="#f4f6f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 1カラム。上部タブで「記録」「予定」を切替。記録は保存ボタンを画面下に固定、予定は月〜日の縦リスト */
:root {
  --bg: #f4f6f1;
  --surface: #ffffff;
  --fg: #1d241c;
  --muted: #5d6a5b;
  --line: #d9dfd3;
  --accent: #e8731a;      /* コントロールフラッグのオレンジ */
  --accent-fg: #ffffff;
  --forest: #3f7d3a;
  --contour: #9a5b2a;     /* 等高線の茶 */
  --water: #2f78b7;       /* 地図の水系の青。補強に使う */
  --warn: #c0392b;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141913; --surface: #1d241c; --fg: #e8ede4; --muted: #9aa697; --line: #2f392d;
    --accent: #f08a35; --accent-fg: #1a1208; --forest: #7cbf74; --contour: #d29a63; --water: #6eb1e8; --warn: #ef6b5b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141913; --surface: #1d241c; --fg: #e8ede4; --muted: #9aa697; --line: #2f392d;
  --accent: #f08a35; --accent-fg: #1a1208; --forest: #7cbf74; --contour: #d29a63; --water: #6eb1e8; --warn: #ef6b5b; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.35rem; margin: 0; letter-spacing: .02em; }
.countdown { font-size: .85rem; color: var(--muted); }
.countdown b { font-family: var(--font-num); color: var(--accent); font-size: 1.05rem; }
h2 { font-size: .8rem; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
h2 small { font-weight: 400; letter-spacing: 0; margin-left: 6px; }
section { min-width: 0; }
.view { display: grid; gap: 22px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--line); }
.tabs button {
  min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
  font: inherit; font-weight: 700; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); }

.acts { display: grid; gap: 8px; }
.act {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left;
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--fg); font: inherit; cursor: pointer;
}
.act[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.act .when { font-weight: 700; }
.act .stats { grid-column: 1; font-family: var(--font-num); font-size: .8rem; color: var(--muted); }
.act .chip { grid-row: 1 / span 2; grid-column: 2; }
.chip { font-size: .75rem; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.chip.done { background: color-mix(in srgb, var(--forest) 18%, transparent); color: var(--forest); }
.chip.todo { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

.scale { display: grid; gap: 6px; grid-template-columns: repeat(5, 1fr); }
.scale.s11 { grid-template-columns: repeat(6, 1fr); }
.scale button {
  min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  color: var(--fg); font-family: var(--font-num); font-size: 1.1rem; font-weight: 700; cursor: pointer;
}
.scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.scale.pain button[aria-pressed="true"].hurt { background: var(--warn); border-color: var(--warn); }
.hint { font-size: .8rem; color: var(--muted); margin-top: 6px; min-height: 1.2em; }

textarea, input[type="text"], input[type="password"], input[type="date"], select {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 88px; resize: vertical; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tags button {
  font: inherit; font-size: .8rem; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  border: 1px dashed var(--line); background: transparent; color: var(--muted);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.savebar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.savebar .inner { max-width: 560px; margin: 0 auto; display: grid; gap: 6px; }
.preview { font-family: var(--font-num); font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.primary {
  width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg);
  font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer;
}
.primary:disabled { opacity: .45; cursor: default; }
.ghost { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.danger { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--warn); background: transparent; color: var(--warn); cursor: pointer; }
.danger.armed { background: var(--warn); color: var(--accent-fg); }
.status { font-size: .9rem; padding: 10px 12px; border-radius: 10px; }
.status.ok { background: color-mix(in srgb, var(--forest) 15%, transparent); color: var(--forest); }
.status.err { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }

details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
summary { cursor: pointer; font-size: .9rem; color: var(--muted); }
.settings { display: grid; gap: 10px; margin-top: 10px; }
.field { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }

/* 予定 */
.weeknav { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.weeknav .label { text-align: center; font-weight: 700; font-family: var(--font-num); }
.weeknav .label small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .75rem; color: var(--muted); }
.weektotal { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 16px; font-family: var(--font-num); font-size: .8rem; color: var(--muted); }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dow { text-align: center; font-size: .7rem; color: var(--muted); padding-bottom: 2px; }
.dow.sun { color: var(--warn); }
.cell {
  min-height: 66px; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 3px; overflow: hidden;
  border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
  color: var(--fg); font: inherit; text-align: left; cursor: pointer;
}
.cell.out { opacity: .4; }
.cell[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.num { font-family: var(--font-num); font-size: .72rem; font-weight: 700; min-width: 1.6em; line-height: 1.6em; text-align: center; align-self: flex-start; border-radius: 999px; }
.cell.today .num { background: var(--accent); color: var(--accent-fg); }
.lbl {
  display: block; font-style: normal; font-size: .6rem; line-height: 1.3; padding: 1px 3px; border-radius: 3px;
  white-space: nowrap; overflow: hidden; background: color-mix(in srgb, var(--forest) 18%, transparent); color: var(--forest);
}
.lbl.cat-race { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); font-weight: 700; }
.lbl.cat-note { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
.lbl.cat-strength { background: color-mix(in srgb, var(--water) 20%, transparent); color: var(--water); }
.ev.cat-strength::before { background: var(--water); }
.more { font-size: .6rem; color: var(--muted); }
.cell .done { margin-top: auto; }
.done { font-family: var(--font-num); font-size: .6rem; color: var(--forest); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: .72rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend .lbl { width: 14px; height: 10px; padding: 0; }

.day { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.dayhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dlabel { font-weight: 700; }
.dlabel .wd { color: var(--muted); font-weight: 400; margin-left: 2px; }
.add { font: inherit; font-size: .8rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.ev {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 0 10px; align-items: center; width: 100%; text-align: left;
  padding: 8px 10px 8px 0; border: 0; border-radius: 8px; background: color-mix(in srgb, var(--line) 45%, transparent);
  color: var(--fg); font: inherit; cursor: pointer; overflow: hidden;
}
.ev::before { content: ""; align-self: stretch; background: var(--forest); }
.ev.cat-note::before { background: var(--muted); }
.ev.cat-race::before { background: var(--accent); }
.ev .evname { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.ev .evmeta { font-family: var(--font-num); font-size: .75rem; color: var(--muted); white-space: nowrap; }
.actual { font-size: .8rem; color: var(--forest); font-family: var(--font-num); }
.actual.none { color: var(--muted); font-family: var(--font-body); }
.emptyday { font-size: .8rem; color: var(--muted); }

/* 種目の図解 */
.exlib { display: grid; gap: 22px; }
.exgroup { display: grid; gap: 10px; scroll-margin-top: 16px; }
.exgroup h3 { margin: 0; font-size: 1.05rem; text-wrap: balance; }
.exgroup > p { margin: 0; font-size: .8rem; color: var(--muted); }
.exnav { display: flex; flex-wrap: wrap; gap: 6px; }
.exnav a { font-size: .8rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.ex { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); scroll-margin-top: 16px; min-width: 0; }
.ex h4 { margin: 0; font-size: 1rem; }
.ex .aim { margin: 0; font-size: .8rem; color: var(--forest); }
.frames { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px; }
.frames.one { grid-template-columns: minmax(0, 220px); justify-content: center; }
.frame { display: grid; justify-items: center; gap: 2px; min-width: 0; }
.frame span { font-size: .7rem; color: var(--muted); }
.fig { width: 100%; max-width: 200px; height: auto; border-radius: 8px; background: color-mix(in srgb, var(--line) 30%, transparent); }
.frames .arrow { color: var(--accent); font-weight: 700; }
.ex ol { margin: 0; padding-left: 1.3em; font-size: .88rem; display: grid; gap: 3px; }
.ex ul { margin: 0; padding-left: 1.1em; font-size: .8rem; color: var(--muted); display: grid; gap: 2px; }
.how { display: grid; gap: 10px; }
.how > h4 { margin: 0; font-size: .8rem; color: var(--muted); letter-spacing: .08em; }

.sheet-bg { position: fixed; inset: 0; background: color-mix(in srgb, #000 45%, transparent); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88vh; overflow-y: auto;
  background: var(--bg); border-radius: 16px 16px 0 0; border-top: 1px solid var(--line);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet .inner { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
.sheet h3 { margin: 0; font-size: 1.05rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet textarea { min-height: 140px; font-family: var(--font-num); font-size: .85rem; }
@media (prefers-reduced-motion: no-preference) { .scale button, .act, .ev { transition: background .12s, border-color .12s; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>練習メモ</h1>
    <div class="countdown">インカレまで <b id="daysLeft">-</b> 日</div>
  </header>

  <div class="tabs" role="tablist">
    <button id="tab-memo" type="button" role="tab" aria-selected="true">記録</button>
    <button id="tab-plan" type="button" role="tab" aria-selected="false">予定</button>
    <button id="tab-ex" type="button" role="tab" aria-selected="false">種目</button>
  </div>

  <div id="status" class="status" hidden></div>

  <details id="setup">
    <summary>Intervals.icu の接続設定</summary>
    <div class="settings">
      <label class="field" for="aid">Athlete ID<input id="aid" type="text" placeholder="i123456" autocomplete="off"></label>
      <label class="field" for="key">API Key<input id="key" type="password" placeholder="Settings › Developer Settings" autocomplete="off"></label>
      <button id="saveCfg" class="ghost" type="button">保存して読み込む</button>
    </div>
  </details>

  <div id="memoView" class="view">
    <section>
      <h2>どの練習？<small>直近7日</small></h2>
      <div id="acts" class="acts"><div class="hint">読み込み中…</div></div>
    </section>

    <section>
      <h2>RPE（きつさ）</h2>
      <div id="rpe" class="scale"></div>
      <div id="rpeHint" class="hint"></div>
    </section>

    <section>
      <h2>疲労（今朝の体の重さ）</h2>
      <div id="fatigue" class="scale"></div>
      <div id="fatigueHint" class="hint"></div>
    </section>

    <section>
      <h2>痛み（腸脛靭帯など）</h2>
      <div id="pain" class="scale s11 pain"></div>
    </section>

    <section>
      <h2>メモ</h2>
      <textarea id="memo" placeholder="例：登り後半で脚が止まった"></textarea>
      <div id="tags" class="tags"></div>
    </section>
  </div>

  <div id="planView" class="view" hidden>
    <div class="weeknav">
      <button id="prevMonth" class="ghost" type="button" aria-label="前の月">←</button>
      <div id="monthLabel" class="label">-</div>
      <button id="nextMonth" class="ghost" type="button" aria-label="次の月">→</button>
    </div>
    <div>
      <div id="cal" class="cal"><div class="hint">読み込み中…</div></div>
      <div class="legend">
        <span><i class="lbl cat-workout"></i>練習</span>
        <span><i class="lbl cat-strength"></i>補強</span>
        <span><i class="lbl cat-race"></i>大会</span>
        <span><i class="lbl cat-note"></i>メモ・休養</span>
        <span class="done">✓ 実績あり</span>
      </div>
    </div>
    <section id="dayDetail" class="day" hidden></section>
    <div id="weekTotal" class="weektotal"></div>
    <button id="toToday" class="ghost" type="button">今日に戻る</button>
  </div>

  <div id="exView" class="view" hidden>
    <div id="exNav" class="exnav"></div>
    <div id="exLib" class="exlib"></div>
  </div>
</main>

<div id="memoBar" class="savebar">
  <div class="inner">
    <div id="preview" class="preview"></div>
    <button id="save" class="primary" type="button" disabled>保存</button>
  </div>
</div>

<div id="sheetBg" class="sheet-bg" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="inner">
    <h3 id="sheetTitle">予定を追加</h3>
    <div id="edHow" class="how" hidden></div>
    <label class="field" for="edTpl" id="edTplWrap">よく使うメニュー
      <select id="edTpl"><option value="">選ぶと下に入ります</option></select>
    </label>
    <div class="row2">
      <label class="field" for="edDate">日付<input id="edDate" type="date"></label>
      <label class="field" for="edCat">種類
        <select id="edCat">
          <option value="WORKOUT">練習</option>
          <option value="NOTE">メモ・休養</option>
          <option value="RACE_C">大会</option>
          <option value="RACE_B">大会（重要）</option>
          <option value="RACE_A">大会（本番）</option>
        </select>
      </label>
    </div>
    <label class="field" for="edName">タイトル<input id="edName" type="text" placeholder="例：200m×8"></label>
    <label class="field" for="edDesc">内容
      <textarea id="edDesc" placeholder="- 40m 5:30/km Pace"></textarea>
    </label>
    <div class="hint">「- 15m 5:30/km Pace」「8x」のように書くと、COROSの時計に手順付きで届きます。「m」は分の意味なので、距離は「0.2km」のように書きます。普通の文章でもOK。</div>
    <button id="edSave" class="primary" type="button">保存</button>
    <div class="btnrow">
      <button id="edCancel" class="ghost" type="button">閉じる</button>
      <button id="edDelete" class="danger" type="button">削除</button>
    </div>
  </div>
</div>

<script>
const API = "https://intervals.icu/api/v1";
const RACE = new Date("2027-03-13T00:00:00");
const RPE_HINT = {1:"ほぼ休み",2:"散歩",3:"かなり楽なジョグ",4:"楽なジョグ",5:"普通のジョグ",6:"少しきつい",7:"閾値走くらい",8:"きつい",9:"とてもきつい",10:"全力"};
const FATIGUE_HINT = {1:"とても元気",2:"元気",3:"普通",4:"重い",5:"かなり重い"};
const TAGS = ["登りがきつい","下りで脚にきた","脚が軽い","呼吸がきつい","眠い","暑かった","藪が濃い","ミスあり"];
const PATTERNS = { rpe: /RPE\s*[:：]\s*(\d+(?:\.\d+)?)/i, fatigue: /疲労\s*[:：]\s*(\d+(?:\.\d+)?)/, pain: /痛み\s*[:：]\s*(\d+(?:\.\d+)?)/ };
// 書式の「m」は分。距離は km で書く
const STRIDES = "5x\n- 0.1km 3:20/km Pace\n- 0.1km 6:30/km Pace";
const TEMPLATES = [
  { name: "ジョグ40分＋流し", cat: "WORKOUT", desc: `- 40m 5:30/km Pace\n\n${STRIDES}` },
  { name: "ジョグ50分＋流し", cat: "WORKOUT", desc: `- 50m 5:30/km Pace\n\n${STRIDES}` },
  { name: "O-プレハブ Lv1", cat: "WORKOUT", type: "WeightTraining", desc: "ランの前に10分。各2セット、左右とも。\n\n・片脚カーフレイズ（平地） 15回\n・ランナーズポーズ 30秒（片脚立ちで腕振りの姿勢、反対の膝を上げて保つ）\n・片脚立ち 30秒\n・片脚スター 各方向3回（反対の足先を前・横・後ろにタッチ）\n・両脚ホップ 前後・左右 各10回" },
  { name: "O-プレハブ Lv2", cat: "WORKOUT", type: "WeightTraining", desc: "ランの前に10分。各2セット、左右とも。\n\n・片脚カーフレイズ（段差でかかとを下まで） 15回\n・ランナーズポーズ（目を閉じて） 30秒\n・片脚立ち（芝やクッションの上） 30秒\n・片脚スター 各方向3回\n・片脚ホップ 前後・左右 各10回（静かに着地）" },
  { name: "O-プレハブ Lv3", cat: "WORKOUT", type: "WeightTraining", desc: "ランの前に10分。各2セット、左右とも。\n\n・片脚カーフレイズ（段差、5秒かけて下ろす） 15回\n・片脚ジャンプ→着地で2秒止まる 8回\n・片脚立ちで地図を読む 30秒（レッグを1本追う）\n・片脚ホップ 4方向連続 3周\n・不整地で片脚着地 8回" },

// 補強のテンプレートには、Intervals.icu や COROS からも図解を開けるようリンクを付ける
const EX_LINK = { "O-プレハブ": "P", "補強A": "A", "補強B": "B", "補強C": "C" };
for (const t of TEMPLATES) {
  const g = Object.entries(EX_LINK).find(([k]) => t.name.startsWith(k));
  if (g) t.desc += `\n\n図解：https://masatakasabu-ops.github.io/Training-memo/#ex-menu-${g[1]}`;
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const state = { rpe: null, fatigue: null, pain: 0 };
let cfg = loadCfg(), acts = [], selected = null;
let monthStart = firstOfMonth(new Date()), selDate = ymd(new Date());
let monthEvents = [], monthActs = [], editing = null, edType = "Run";

function loadCfg() {
  try { return JSON.parse(localStorage.getItem("intervalsCfg")) || {}; } catch { return {}; }
}
function storeCfg(c) {
  try { localStorage.setItem("intervalsCfg", JSON.stringify(c)); } catch {}
}

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { Authorization: "Basic " + btoa("API_KEY:" + cfg.key), "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 || res.status === 403) throw new Error("接続できません。Athlete ID と API Key を確認してください。");
  if (!res.ok) throw new Error(`Intervals.icu がエラーを返しました（${res.status}）。少し待ってから再度お試しください。`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function showStatus(msg, kind) {
  const el = $("status");
  el.textContent = msg; el.className = "status " + kind; el.hidden = !msg;
}

function pad(n) { return String(n).padStart(2, "0"); }
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function monday(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
const WD = "日月火水木金土";

/* ---------- 記録 ---------- */

function parseNotes(desc) {
  const out = { rpe: null, fatigue: null, pain: null, memo: "" };
  if (!desc) return out;
  for (const k in PATTERNS) { const m = desc.match(PATTERNS[k]); if (m) out[k] = Number(m[1]); }
  const m = desc.match(/メモ\s*[:：]\s*([\s\S]*)/);
  if (m) out.memo = m[1].trim();
  else if (!PATTERNS.rpe.test(desc) && !PATTERNS.fatigue.test(desc)) out.memo = desc.trim();
  return out;
}
const isDone = a => { const n = parseNotes(a.description); return (a.icu_rpe || n.rpe) != null && n.fatigue != null; };

function composeDesc() {
  const parts = [];
  if (state.rpe != null) parts.push(`RPE:${state.rpe}`);
  if (state.fatigue != null) parts.push(`疲労:${state.fatigue}`);
  parts.push(`痛み:${state.pain}`);
  const memo = $("memo").value.trim();
  if (memo) parts.push(`メモ:${memo}`);
  return parts.join(" ");
}

function buildScale(id, from, to, key) {
  const box = $(id);
  for (let v = from; v <= to; v++) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = v; b.id = `${id}-${v}`;
    if (key === "pain" && v >= 3) b.classList.add("hurt");
    b.addEventListener("click", () => { state[key] = v; render(); });
    box.appendChild(b);
  }
}

function render() {
  for (const [id, from, to] of [["rpe", 1, 10], ["fatigue", 1, 5], ["pain", 0, 10]]) {
    for (let v = from; v <= to; v++) $(`${id}-${v}`).setAttribute("aria-pressed", String(state[id] === v));
  }
  $("rpeHint").textContent = state.rpe ? RPE_HINT[state.rpe] : "1 散歩 ／ 5 ジョグ ／ 7 閾値走 ／ 10 全力";
  $("fatigueHint").textContent = state.fatigue ? FATIGUE_HINT[state.fatigue] : "1 とても元気 ／ 3 普通 ／ 5 かなり重い";
  $("preview").textContent = selected ? composeDesc() : "練習を選んでください";
  $("save").disabled = !selected || state.rpe == null;
}

function renderActs() {
  const box = $("acts");
  box.innerHTML = "";
  if (!acts.length) { box.innerHTML = '<div class="hint">直近7日の記録がありません。COROSから同期されるまで少し待ってください。</div>'; return; }
  for (const a of acts) {
    const done = isDone(a);
    const d = new Date(a.start_date_local);
    const b = document.createElement("button");
    b.type = "button"; b.className = "act"; b.id = `act-${a.id}`;
    b.setAttribute("aria-pressed", String(selected && selected.id === a.id));
    b.innerHTML = `<span class="when">${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}</span>
      <span class="stats">${((a.distance || 0) / 1000).toFixed(1)}km ・ ↑${Math.round(a.total_elevation_gain || 0)}m ・ ${Math.round((a.moving_time || 0) / 60)}分</span>
      <span class="chip ${done ? "done" : "todo"}">${done ? "記入済" : "未記入"}</span>`;
    b.addEventListener("click", () => select(a));
    box.appendChild(b);
  }
}

function select(a) {
  selected = a;
  const n = parseNotes(a.description);
  state.rpe = n.rpe ?? a.icu_rpe ?? null;
  state.fatigue = n.fatigue;
  state.pain = n.pain ?? 0;
  $("memo").value = n.memo;
  showStatus("", "");
  renderActs(); render();
}

async function loadActs() {
  try {
    const today = new Date();
    const list = await api("GET", `/athlete/${encodeURIComponent(cfg.aid)}/activities?oldest=${ymd(addDays(today, -6))}&newest=${ymd(today)}`);
    // 1分未満の細切れ記録（大会のアップ等）は除く
    acts = list.filter(a => (a.moving_time || 0) >= 60).sort((x, y) => y.start_date_local.localeCompare(x.start_date_local));
    if (acts.length) select(acts.find(a => !isDone(a)) || acts[0]); else renderActs();
  } catch (e) {
    $("acts").innerHTML = ""; showStatus(e.message, "err"); $("setup").open = true;
  }
}

$("save").addEventListener("click", async () => {
  if (!selected) return;
  const btn = $("save");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const desc = composeDesc();
    const updated = await api("PUT", `/activity/${selected.id}`, { description: desc, icu_rpe: state.rpe });
    Object.assign(selected, { description: updated?.description ?? desc, icu_rpe: updated?.icu_rpe ?? state.rpe });
    showStatus("保存しました。", "ok");
    renderActs();
    const next = acts.find(a => a !== selected && !isDone(a));
    if (next) setTimeout(() => select(next), 900);
  } catch (e) {
    showStatus(e.message, "err");
  } finally {
    btn.textContent = "保存"; render();
  }
});

/* ---------- 予定 ---------- */

const catClass = (c, type) => c === "NOTE" ? "cat-note" : (c || "").startsWith("RACE") ? "cat-race"
  : type === "WeightTraining" ? "cat-strength" : "cat-workout";

const onDay = (list, key) => list.filter(x => x.start_date_local.slice(0, 10) === key);
const sumKm = list => list.reduce((s, a) => s + (a.distance || 0), 0) / 1000;
const sumMin = list => list.reduce((s, a) => s + (a.moving_time || 0), 0) / 60;

async function loadMonth() {
  const gridStart = monday(monthStart);
  const lastDay = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0);
  const gridEnd = addDays(monday(lastDay), 6);
  $("monthLabel").innerHTML = `${monthStart.getFullYear()}年${monthStart.getMonth() + 1}月<small>インカレまで ${Math.max(0, Math.ceil((RACE - new Date()) / 86400000))} 日</small>`;
  try {
    const q = `oldest=${ymd(gridStart)}&newest=${ymd(gridEnd)}`;
    [monthEvents, monthActs] = await Promise.all([
      api("GET", `/athlete/${encodeURIComponent(cfg.aid)}/events?${q}`),
      api("GET", `/athlete/${encodeURIComponent(cfg.aid)}/activities?${q}`),
    ]);
    renderMonth(gridStart, gridEnd);
    renderDay();
  } catch (e) {
    $("cal").innerHTML = ""; showStatus(e.message, "err");
  }
}

function renderMonth(gridStart, gridEnd) {
  const box = $("cal");
  box.innerHTML = "月火水木金土日".split("").map(w => `<div class="dow${w === "日" ? " sun" : ""}">${w}</div>`).join("");
  const todayKey = ymd(new Date());
  for (let d = gridStart; d <= gridEnd; d = addDays(d, 1)) {
    const key = ymd(d);
    const evs = onDay(monthEvents, key);
    const acts = onDay(monthActs, key);
    const c = document.createElement("button");
    c.type = "button"; c.id = `cell-${key}`;
    c.className = "cell" + (d.getMonth() !== monthStart.getMonth() ? " out" : "") + (key === todayKey ? " today" : "");
    c.setAttribute("aria-pressed", String(key === selDate));
    c.setAttribute("aria-label", `${d.getMonth() + 1}月${d.getDate()}日 ${evs.map(e => e.name).join("、")}`);
    // 大会を先に見せる
    const shown = [...evs].sort((a, b) => (catClass(b.category) === "cat-race") - (catClass(a.category) === "cat-race"));
    c.innerHTML = `<span class="num">${d.getDate()}</span>`
      + shown.slice(0, 2).map(e => `<i class="lbl ${catClass(e.category, e.type)}">${esc(e.name)}</i>`).join("")
      + (shown.length > 2 ? `<span class="more">+${shown.length - 2}</span>` : "")
      + (acts.length ? `<span class="done">✓${sumKm(acts).toFixed(1)}</span>` : "");
    c.addEventListener("click", () => {
      $(`cell-${selDate}`)?.setAttribute("aria-pressed", "false");
      selDate = key;
      c.setAttribute("aria-pressed", "true");
      renderDay();
    });
    box.appendChild(c);
  }
}

function renderDay() {
  const d = new Date(`${selDate}T00:00:00`);
  const evs = onDay(monthEvents, selDate);
  const acts = onDay(monthActs, selDate);
  const todayKey = ymd(new Date());
  const el = $("dayDetail");
  el.hidden = false;
  el.innerHTML = `<div class="dayhead"><span class="dlabel">${d.getMonth() + 1}/${d.getDate()}<span class="wd">（${WD[d.getDay()]}）</span></span>
    <button class="add" type="button">＋追加</button></div>`;
  el.querySelector(".add").addEventListener("click", () => openEditor(null, selDate));
  for (const e of evs) {
    const meta = [e.moving_time ? `${Math.round(e.moving_time / 60)}分` : "", e.distance ? `${(e.distance / 1000).toFixed(1)}km` : ""].filter(Boolean).join("・");
    const b = document.createElement("button");
    b.type = "button"; b.className = `ev ${catClass(e.category, e.type)}`;
    b.innerHTML = `<span class="evname">${esc(e.name)}</span><span class="evmeta">${meta}</span>`;
    b.addEventListener("click", () => openEditor(e));
    el.appendChild(b);
  }
  if (!evs.length) el.insertAdjacentHTML("beforeend", '<div class="emptyday">予定なし</div>');
  if (acts.length) {
    const rpes = acts.map(a => a.icu_rpe || parseNotes(a.description).rpe).filter(Boolean);
    el.insertAdjacentHTML("beforeend", `<div class="actual">実績 ${sumKm(acts).toFixed(1)}km・${Math.round(sumMin(acts))}分${rpes.length ? `・RPE${Math.max(...rpes)}` : ""}</div>`);
  } else if (selDate < todayKey && evs.some(e => e.category === "WORKOUT")) {
    el.insertAdjacentHTML("beforeend", '<div class="actual none">実績なし</div>');
  }

  // 選んだ日を含む週の合計
  const mon = monday(d);
  const keys = Array.from({ length: 7 }, (_, i) => ymd(addDays(mon, i)));
  const wEvs = monthEvents.filter(e => keys.includes(e.start_date_local.slice(0, 10)) && e.category === "WORKOUT");
  const wActs = monthActs.filter(a => keys.includes(a.start_date_local.slice(0, 10)));
  const sun = addDays(mon, 6);
  $("weekTotal").innerHTML = `<span>${mon.getMonth() + 1}/${mon.getDate()}〜${sun.getMonth() + 1}/${sun.getDate()}の週</span>`
    + `<span>予定 ${sumKm(wEvs).toFixed(0)}km・${Math.round(sumMin(wEvs))}分</span>`
    + `<span>実績 ${sumKm(wActs).toFixed(0)}km・${Math.round(sumMin(wActs))}分</span>`;
}

function openEditor(ev, date) {
  editing = ev;
  edType = ev ? ev.type || "Run" : "Run";
  $("sheetTitle").textContent = ev ? "予定を編集" : "予定を追加";
  $("edTplWrap").hidden = !!ev;
  $("edTpl").value = "";
  $("edDate").value = ev ? ev.start_date_local.slice(0, 10) : date;
  $("edCat").value = ev ? ev.category : "WORKOUT";
  $("edName").value = ev ? ev.name || "" : "";
  $("edDesc").value = ev ? ev.description || "" : "";
  $("edDelete").hidden = !ev;
  renderHow(ev ? ev.description : "");
  $("edDelete").classList.remove("armed"); $("edDelete").textContent = "削除";
  $("sheet").hidden = false; $("sheetBg").hidden = false;

function closeEditor() { $("sheet").hidden = true; $("sheetBg").hidden = true; editing = null; }

$("edTpl").addEventListener("change", () => {
  const t = TEMPLATES[Number($("edTpl").value)];
  if (!t) return;
  $("edName").value = t.name; $("edCat").value = t.cat; $("edDesc").value = t.desc;
  edType = t.type || "Run";
  renderHow(t.desc);
});

$("edSave").addEventListener("click", async () => {
  const name = $("edName").value.trim();
  if (!name || !$("edDate").value) { showStatus("タイトルと日付を入れてください。", "err"); return; }
  const body = { category: $("edCat").value, type: edType, start_date_local: `${$("edDate").value}T00:00:00`, name, description: $("edDesc").value };
  const btn = $("edSave");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    if (editing) await api("PUT", `/athlete/${encodeURIComponent(cfg.aid)}/events/${editing.id}`, body);
    else await api("POST", `/athlete/${encodeURIComponent(cfg.aid)}/events`, body);
    closeEditor();
    showStatus(editing ? "予定を更新しました。" : `${name} を追加しました。`, "ok");
    loadMonth();
  } catch (e) {
    showStatus(e.message, "err");
  } finally {
    btn.disabled = false; btn.textContent = "保存";
  }
});

$("edDelete").addEventListener("click", async () => {
  const btn = $("edDelete");
  if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "もう一度押すと削除"; return; }
  try {
    await api("DELETE", `/athlete/${encodeURIComponent(cfg.aid)}/events/${editing.id}`);
    const name = editing.name;
    closeEditor();
    showStatus(`${name} を削除しました。`, "ok");
    loadMonth();
  } catch (e) {
    showStatus(e.message, "err");
  }
});
$("edCancel").addEventListener("click", closeEditor);
$("sheetBg").addEventListener("click", closeEditor);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeEditor(); });

function goMonth(delta) {
  monthStart = new Date(monthStart.getFullYear(), monthStart.getMonth() + delta, 1);
  const today = new Date();
  selDate = ymd(today.getFullYear() === monthStart.getFullYear() && today.getMonth() === monthStart.getMonth() ? today : monthStart);
  loadMonth();
}
$("prevMonth").addEventListener("click", () => goMonth(-1));
$("nextMonth").addEventListener("click", () => goMonth(1));
$("toToday").addEventListener("click", () => { monthStart = firstOfMonth(new Date()); goMonth(0); });

/* ---------- 種目の図解 ---------- */

// 棒人間の骨格。角度は度。脚・腕は真下が0で前（右）が正、胴体は真上が0で前が正。
// la/lb = 手前/奥の脚 [もも, すね, 足先]、aa/ab = 手前/奥の腕 [上腕, 前腕]。足先は前向き水平が0、下向きが負。
const SEG = { torso: 28, thigh: 20, shin: 20, foot: 7, upper: 14, fore: 13, head: 6 };
const FLOOR = 84;
const rad = d => d * Math.PI / 180;
const limb = (p, a, len) => [p[0] + len * Math.sin(rad(a)), p[1] + len * Math.cos(rad(a))];

function figure(pose) {
  const t = pose.t || 0;
  const neck = [SEG.torso * Math.sin(rad(t)), -SEG.torso * Math.cos(rad(t))];
  const ht = t + (pose.ht || 0);
  const head = [neck[0] + 9 * Math.sin(rad(ht)), neck[1] - 9 * Math.cos(rad(ht))];
  const pel = pose.pel || [[0, 0], [0, 0]];
  const leg = (q = [0, 0, 0], off) => {
    const k = limb(off, q[0], SEG.thigh), a = limb(k, q[1], SEG.shin), f = q[2] || 0;
    return [off, k, a, [a[0] + SEG.foot * Math.cos(rad(f)), a[1] - SEG.foot * Math.sin(rad(f))]];
  };
  const arm = (q = [0, 0]) => { const e = limb(neck, q[0], SEG.upper); return [neck, e, limb(e, q[1], SEG.fore)]; };
  const P = { A: leg(pose.la, pel[0]), B: leg(pose.lb, pel[1]), a: arm(pose.aa), b: arm(pose.ab) };
  const pts = [[0, 0], neck, ...P.A, ...P.B, ...P.a, ...P.b];
  const maxY = Math.max(head[1] + SEG.head, ...pts.map(p => p[1]));
  const xs = [head[0] - SEG.head, head[0] + SEG.head, ...pts.map(p => p[0])];
  const dx = 60 - (Math.min(...xs) + Math.max(...xs)) / 2 + (pose.dx || 0);
  const dy = FLOOR - (pose.lift || 0) - maxY;
  const minY = Math.min(head[1] - SEG.head, ...pts.map(p => p[1])) + dy;
  // 跳んだ姿勢や腕を上げた姿勢は、床を基準に縮めて枠に収める
  const scale = Math.min(1, (FLOOR - 3) / (FLOOR - minY), 112 / (Math.max(...xs) - Math.min(...xs)));
  const m = p => [p[0] + dx, p[1] + dy];
  const hip = m([0, 0]), nk = m(neck), hd = m(head);
  for (const k in P) P[k] = P[k].map(m);

  const hl = pose.hl || [];
  const line = (ps, key, far) => `<polyline points="${ps.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" stroke="${hl.includes(key) ? "var(--accent)" : far ? "var(--muted)" : "var(--fg)"}"${far ? ' opacity=".75"' : ""}/>`;
  let back = "", front = "";
  for (const pr of pose.props || []) {
    if (pr.box) {
      let cx, top;
      if (pr.box === "hip") { cx = hip[0]; top = hip[1] + 3; }
      else { const L = P[pr.box]; cx = (L[2][0] + L[3][0]) / 2; top = Math.max(L[2][1], L[3][1]) + 1.5; }
      const w = pr.w || 22;
      back += `<rect x="${(cx - w / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${w}" height="${Math.max(0, FLOOR - top).toFixed(1)}" rx="1.5" fill="var(--line)"/>`;
    }
    if (pr.boxRel) {
      const [rx, h, w = 22] = pr.boxRel;
      back += `<rect x="${(hip[0] + rx - w / 2).toFixed(1)}" y="${FLOOR - h}" width="${w}" height="${h}" rx="1.5" fill="var(--line)"/>`;
    }
    if (pr.wall) {
      const x = (P[pr.wall][2][0] + 2.5).toFixed(1);
      back += `<line x1="${x}" y1="${FLOOR}" x2="${x}" y2="${FLOOR - 76}" stroke="var(--line)" stroke-width="3"/>`;
    }
    if (pr.anchor) {
      const a = P[pr.anchor][2];
      front += `<rect x="${(a[0] - 12).toFixed(1)}" y="${(a[1] - 13).toFixed(1)}" width="16" height="9" rx="2" fill="var(--line)"/>`;
    }
    if (pr.towel) {
      const L = P[pr.towel], x0 = L[2][0] - 5, y = FLOOR - 1;
      back += `<path d="M${x0.toFixed(1)} ${y} q3 -3 6 0 t6 0 t6 0" stroke="var(--water)" stroke-width="2" fill="none"/>`;
    }
    if (pr.map) {
      const h = P[pr.map][2];
      front += `<rect x="${(h[0] - 5).toFixed(1)}" y="${(h[1] - 7).toFixed(1)}" width="11" height="9" rx="1" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.2"/>`
        + `<circle cx="${(h[0] + .5).toFixed(1)}" cy="${(h[1] - 2.5).toFixed(1)}" r="2" fill="none" stroke="var(--accent)" stroke-width=".9"/>`;
    }
  }
  const fit = scale < 1 ? ` transform="translate(60 ${FLOOR}) scale(${scale.toFixed(3)}) translate(-60 -${FLOOR})"` : "";
  return `<svg class="fig" viewBox="0 0 120 92" aria-hidden="true"><line x1="4" y1="${FLOOR + 1.5}" x2="116" y2="${FLOOR + 1.5}" stroke="var(--muted)" stroke-width="1" opacity=".6"/><g${fit}>${back}`
    + `<g fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">`
    + line(P.B, "B", true) + line(P.b, "b", true)
    + (pose.pel ? line([P.A[0], P.B[0]], "t") : "")
    + line([hip, nk], "t") + line(P.A, "A") + line(P.a, "a")
    + `</g><circle cx="${hd[0].toFixed(1)}" cy="${hd[1].toFixed(1)}" r="${SEG.head}" fill="var(--surface)" stroke="${hl.includes("t") ? "var(--accent)" : "var(--fg)"}" stroke-width="2.6"/>${front}</g></svg>`;
}

function exCard(ex) {
  const labels = ex.labels || ["はじめ", "おわり"];
  const frames = ex.frames.length === 1
    ? `<div class="frames one"><div class="frame">${figure(ex.frames[0])}</div></div>`
    : `<div class="frames"><div class="frame">${figure(ex.frames[0])}<span>${labels[0]}</span></div><span class="arrow">→</span><div class="frame">${figure(ex.frames[1])}<span>${labels[1]}</span></div></div>`;
  return `<article class="ex" id="ex-${ex.id}"><h4>${ex.name}</h4>${frames}<p class="aim">${ex.aim}</p>`
    + `<ol>${ex.steps.map(s => `<li>${s}</li>`).join("")}</ol><ul>${ex.cues.map(s => `<li>${s}</li>`).join("")}</ul></article>`;
}

function matchExercises(text) {
  const found = [];
  for (const line of (text || "").split("\n")) {
    const ex = EXERCISES.find(e => e.keys.some(k => line.includes(k)));
    if (ex && !found.includes(ex)) found.push(ex);
  }
  return found;
}

function renderHow(text) {
  const exs = matchExercises(text);
  $("edHow").hidden = !exs.length;
  $("edHow").innerHTML = exs.length ? `<h4>やり方（${exs.length}種目）</h4>` + exs.map(exCard).join("") : "";
}

// 一覧は練習で行う順に並べる
const LIB_ORDER = ["calf_raise", "runners_pose", "single_leg_stand", "star", "hops", "hop_stick", "map_balance",
  "squat_jump", "bulgarian", "stepup_knee", "sl_hip_lift", "bent_knee_calf", "split_jump", "box_pistol", "nordic",
  "lunge_walk", "bounding", "drop_land", "step_down", "hop_slope",
  "side_leg_raise", "hip_hike", "skater_squat", "ankle_walks", "towel",
  "map_plank", "side_plank", "dead_bug", "bird_dog", "mountain_climber", "hollow", "power_walk"];

let exBuilt = false;
function buildLibrary() {
  if (exBuilt) return;
  exBuilt = true;
  const sorted = [...EXERCISES].sort((a, b) => LIB_ORDER.indexOf(a.id) - LIB_ORDER.indexOf(b.id));
  $("exNav").innerHTML = Object.entries(EX_GROUPS).map(([g, v]) => `<a href="#ex-menu-${g}">${v.name}</a>`).join("");
  $("exLib").innerHTML = Object.entries(EX_GROUPS).map(([g, v]) =>
    `<section class="exgroup" id="ex-menu-${g}"><h3>${v.name}</h3><p>${v.note}</p>`
    + sorted.filter(e => e.g === g).map(exCard).join("") + "</section>").join("");
}

function openExFromHash() {
  if (!location.hash.startsWith("#ex")) return;
  setTab("ex");
  document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
window.addEventListener("hashchange", openExFromHash);

/* ---------- 共通 ---------- */

let planLoaded = false;
function setTab(tab, load = true) {
  $("tab-memo").setAttribute("aria-selected", String(tab === "memo"));
  $("tab-plan").setAttribute("aria-selected", String(tab === "plan"));
  $("tab-ex").setAttribute("aria-selected", String(tab === "ex"));
  $("memoView").hidden = tab !== "memo";
  $("memoBar").hidden = tab !== "memo";
  $("planView").hidden = tab !== "plan";
  $("exView").hidden = tab !== "ex";
  if (tab === "ex") buildLibrary();
  showStatus("", "");
  try { localStorage.setItem("tab", tab); } catch {}
  if (load && tab === "plan" && !planLoaded && cfg.aid && cfg.key) { planLoaded = true; loadMonth(); }
}
$("tab-memo").addEventListener("click", () => setTab("memo"));
$("tab-plan").addEventListener("click", () => setTab("plan"));
$("tab-ex").addEventListener("click", () => setTab("ex"));

function start() {
  if (!cfg.aid || !cfg.key) {
    $("setup").open = true;
    $("acts").innerHTML = '<div class="hint">最初に接続設定を入力してください。</div>';
    $("cal").innerHTML = '<div class="hint">最初に接続設定を入力してください。</div>';
    return;
  }
  loadActs();
  planLoaded = !$("planView").hidden;
  if (planLoaded) loadMonth();
}

$("saveCfg").addEventListener("click", () => {
  cfg = { aid: $("aid").value.trim(), key: $("key").value.trim() };
  storeCfg(cfg);
  $("setup").open = false;
  start();
});

}

setTab(savedTab, false);
render();
start();
openExFromHash();
